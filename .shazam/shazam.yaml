config:
  auto_approve: true
  auto_retry: true
  max_concurrent: 12
  max_retries: 2
  poll_interval: 5000
  module_lock: true
  peer_reassign: true

tech_stack:
  core:
    language: Elixir
    framework: OTP (GenServer, ETS, DynamicSupervisor)
    api: Bandit + Plug
  cli:
    language: Elixir + Rust
    tui: ratatui + crossterm
  dashboard:
    language: TypeScript
    framework: Vue 3
    styling: Tailwind CSS
    build: Vite
  vscode:
    language: TypeScript
    framework: VS Code Extension API
