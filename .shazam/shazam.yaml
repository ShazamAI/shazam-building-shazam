provider: claude_code

company:
  name: Shazam
  mission: "Coordinate multiple AI agents in hierarchical teams. Define roles, delegate tasks, and let your AI company ship software autonomously."

workspaces:
  core:
    path: /Users/raphaelbarbosa/Projects/ShazamAI/shazam-core
    domains: ["lib/", "test/", "config/"]
  cli:
    path: /Users/raphaelbarbosa/Projects/ShazamAI/shazam-cli
    domains: ["lib/", "test/", "shazam-tui/"]
  dashboard:
    path: /Users/raphaelbarbosa/Projects/ShazamAI/shazam-dashboard
    domains: ["src/", "components/", "pages/", "composables/", "assets/"]
  vscode:
    path: /Users/raphaelbarbosa/Projects/ShazamAI/shazam-vscode
    domains: ["src/", "extension/", "webview/"]

domains:
  core:
    description: "Shazam Core — Elixir backend engine (OTP, TaskBoard, RalphLoop, API)"
    paths:
      - "lib/"
      - "config/"
  cli:
    description: "Shazam CLI — TUI interface, commands, YAML parser (Elixir + Rust)"
    paths:
      - "lib/"
      - "shazam-tui/"
  dashboard:
    description: "Vue 3 web dashboard for Shazam (TypeScript + Tailwind)"
    paths:
      - "src/"
      - "components/"
      - "pages/"
  vscode-extension:
    description: "VS Code extension for Shazam (TypeScript + VS Code API)"
    paths:
      - "src/"
      - "extension/"

